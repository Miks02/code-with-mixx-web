<div class="grid grid-cols-1 lg:grid-cols-5 lg:grid-rows-3 w-full lg:h-full gap-4">
  <app-students-list
    class="min-w-0 lg:col-span-3 lg:row-span-2"
    [pagedStudents]="studentsData()"
    [selectedStudentId]="selectedStudent()?.id"
    [selectedSort]="queryParams().sortBy"
    (searchChanged)="onSearchChange($event)"
    [selectedFilters]="queryParams().filters"
    [showOnlyDeleted]="queryParams().includeDeleted"
    (studentSelected)="onStudentSelected($event)"
    (sortChanged)="onSortChange($event)"
    (filtersChanged)="onFilterChange($event)"
    (deletedToggled)="onDeleteToggle($event)"
    (openCreationForm)="isCreateFormVisible.set(true)"
  ></app-students-list>

  @if (studentToEdit()) {
  <app-edit-student-form
    class="min-w-0 lg:col-span-2 lg:row-span-2"
    [selectedStudent]="studentToEdit()"
    (closeForm)="studentToEdit.set(null)"
    (updatedStudent)="onStudentEdited($event)"
  ></app-edit-student-form>
  } @else {
  <app-student-details
    class="min-w-0 lg:col-span-2 lg:row-span-2"
    [student]="selectedStudent()"
    (editStudent)="studentToEdit.set($event)"
    (studentDeleted)="onStudentDeleted()"
    (studentUpdated)="onStudentUpdated($event)"
  ></app-student-details>
  }

  <div class="min-w-0 lg:col-span-3 grid grid-cols-1 sm:grid-cols-2 gap-4">
    <app-stats-card
      title="Aktivni"
      icon="faSolidUserCheck"
      iconBackground="emerald"
      description="Aktivni nalozi"
      [value]="studentsSummaryData()?.activeStudents"
      [isPending]="studentsSummaryPending()"
    ></app-stats-card>

    <app-stats-card
      title="Na čekanju"
      icon="faSolidUserClock"
      iconBackground="amber"
      description="Nalozi koji nisu aktivirani"
      [value]="studentsSummaryData()?.pendingStudents"
      [isPending]="studentsSummaryPending()"
    ></app-stats-card>

    <app-stats-card
      title="Deaktivirani"
      icon="faSolidUserSlash"
      iconBackground="orange"
      description="Deaktivirani nalozi"
      [value]="studentsSummaryData()?.deactivatedStudents"
      [isPending]="studentsSummaryPending()"
    ></app-stats-card>

    <app-stats-card
      title="Obrisani"
      icon="faSolidUserXmark"
      iconBackground="red"
      description="Obrisani nalozi"
      [value]="studentsSummaryData()?.deletedStudents"
      [isPending]="studentsSummaryPending()"
    ></app-stats-card>
  </div>

  <app-most-active-student
    class="min-w-0 lg:col-span-2"
    [student]="mostActiveStudent()"
    [isPending]="studentsSummaryPending()"
  ></app-most-active-student>

  <app-create-student-form
    (closed)="isCreateFormVisible.set(false)"
    [isVisible]="isCreateFormVisible()"
  >
  </app-create-student-form>
</div>
