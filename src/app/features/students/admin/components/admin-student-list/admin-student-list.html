<app-paged-list
  class="h-full min-h-80"
  title="Studenti"
  emptyMessage="Nije pronadjen nijedan student. Promeni filtere."
  [page]="store.studentsQuery.data()"
  [isPending]="store.studentsPending()"
  (previousPage)="store.previousPage()"
  (nextPage)="store.nextPage()"
>
  <ng-container filters>
    <app-filter-container>
      <app-filter-menu
        [options]="filters"
        [conflictingOptions]="conflictingFilters"
        [selected]="store.params.filters()"
        (selectedChanged)="store.setFilters($event)"
      ></app-filter-menu>
    </app-filter-container>

    <app-sort-menu
      [options]="sort"
      [selected]="store.params.sortBy()"
      (sortChanged)="store.setSort($event)"
    ></app-sort-menu>

    <app-search-bar
      placeholder="Pretraži studente"
      (searchTerm)="store.setSearchTerm($event)"
    ></app-search-bar>

    <app-button
      class="hidden xl:inline-flex self-center"
      variant="primary"
      size="sm"
      icon="faSolidPlus"
      aria-label="Dodaj studenta"
      (clicked)="store.openCreateModal()"
    >
    </app-button>

    <button
      type="button"
      aria-label="Dodaj studenta"
      (click)="store.openCreateModal()"
      class="xl:hidden shrink-0 rounded-full bg-emerald-700 p-2 flex justify-center items-center border-2 border-emerald-400 cursor-pointer shadow-lg active:scale-95 transition-200"
    >
      <ng-icon name="faSolidPlus" class="text-emerald-300! self-center!"></ng-icon>
    </button>
  </ng-container>

  @for (student of store.students(); track student.id) {
  <app-student-card
    [student]="student"
    [addOpacity]="store.studentsFetching()"
    [isSelected]="student.id === store.selectedStudentId()"
    (selected)="store.selectStudent($event)"
  ></app-student-card>
  }
</app-paged-list>
