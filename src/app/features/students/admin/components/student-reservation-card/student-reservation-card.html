<a
  [routerLink]="detailsLink()"
  [class]="containerClasses()"
  [style]="addOpacity() ? { opacity: 0.5 } : null"
  [attr.aria-label]="'Detalji rezervacije: ' + subjects()"
>
  <div class="flex items-start justify-between gap-3 min-w-0">
    <div class="flex flex-col gap-1 min-w-0">
      <p class="text-emerald-100 font-semibold">{{ typeLabel() }}</p>
      <p class="text-sm text-emerald-300 truncate">{{ subjects() }}</p>
    </div>
    <div class="flex flex-wrap justify-end gap-1.5 shrink-0">
      <span
        class="text-xs font-semibold px-2 py-1 rounded-full"
        [class]="reservationStatus().classes"
        >{{ reservationStatus().label }}</span
      >
      <span
        class="text-xs font-semibold px-2 py-1 rounded-full"
        [class]="paymentStatus().classes"
        >{{ paymentStatus().label }}</span
      >
    </div>
  </div>

  <div
    class="flex flex-col md:flex-row md:flex-wrap gap-x-4 gap-y-1 border-t border-emerald-700/40 pt-2 text-xs text-emerald-300"
  >
    @for (stat of stats(); track stat.label) {
      <div class="flex items-center gap-1.5">
        <ng-icon [name]="stat.icon" class="text-emerald-400! self-center! shrink-0"></ng-icon>
        <span>{{ stat.label }}</span>
        <span class="font-semibold text-emerald-100">{{ stat.value }}</span>
      </div>
    }
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarPlus" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <span>Kreirana</span>
      <span class="font-semibold text-emerald-100">{{
        reservation().createdAt | date: 'dd.MM.yyyy'
      }}</span>
    </div>
  </div>
</a>
