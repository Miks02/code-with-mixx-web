<div class="grid grid-cols-1 lg:grid-cols-5 w-full lg:h-full gap-4">
  <app-student-payments-list class="min-w-0 lg:col-span-3"></app-student-payments-list>

  <div class="min-w-0 lg:col-span-2 flex flex-col gap-4">
    <app-open-balance [summary]="store.openBalance()"></app-open-balance>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <app-stats-card
        title="Uplate"
        icon="faSolidCirclePlus"
        iconBackground="emerald"
        description="Registrovane uplate"
        [value]="store.summary()?.paymentsCount"
        [isPending]="store.summaryPending()"
      ></app-stats-card>

      <app-stats-card
        title="Poništene"
        icon="faSolidRotateLeft"
        iconBackground="orange"
        description="Poništene uplate"
        [value]="store.summary()?.reversalsCount"
        [isPending]="store.summaryPending()"
      ></app-stats-card>

      <app-stats-card
        title="Povraćaji"
        icon="faSolidHandHoldingDollar"
        iconBackground="violet"
        description="Povraćaji novca"
        [value]="store.summary()?.refundsCount"
        [isPending]="store.summaryPending()"
      ></app-stats-card>

      <app-stats-card
        title="Dugovanja"
        icon="faSolidTriangleExclamation"
        iconBackground="red"
        description="Rezervacije koje nisu plaćene"
        [value]="store.summary()?.debtsCount"
        [isPending]="store.summaryPending()"
      ></app-stats-card>
    </div>
  </div>
</div>
