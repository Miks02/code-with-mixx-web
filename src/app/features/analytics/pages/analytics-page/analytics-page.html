<div class="flex gap-4">
  <div class="bg-transparent p-4 rounded-lg flex flex-col gap-6">
    <div class="flex gap-2">
      <div
        class="w-14 h-14 flex items-center justify-center border-2 border-emerald-500 bg-emerald-700 rounded-full"
      >
        <ng-icon name="faSolidUser" class="text-emerald-200! text-xl"></ng-icon>
      </div>
      <div class="flex flex-col">
        <p class="text-lg font-semibold text-emerald-200">Milan Nikolić</p>
        <p class="font-semibold text-amber-500">Administrator</p>
      </div>
    </div>

    <div class="flex gap-4">
      <button
        class="p-2 px-4 border border-emerald-200 flex items-center rounded-lg text-emerald-200 shadow-lg gap-2"
      >
        <ng-icon name="faSolidUserPlus" class="text-emerald-200! text-xl"></ng-icon>
        <span>Dodaj studenta</span>
      </button>

      <button
        class="p-2 px-4 border border-emerald-200 flex items-center rounded-lg text-emerald-200 shadow-lg gap-2"
      >
        <ng-icon name="faSolidFileCirclePlus" class="text-emerald-200! text-xl"></ng-icon>
        <span>Dodaj projekat</span>
      </button>

      <button class="p-2 px-4 flex items-center rounded-lg bg-amber-600 shadow-lg gap-2">
        <ng-icon name="faSolidCalendarPlus" class="text-white! text-xl"></ng-icon>
        <span class="text-white">Zakaži čas</span>
      </button>
    </div>
  </div>
</div>
