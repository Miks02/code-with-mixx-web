<div class="flex flex-col gap-6">
  <div class="flex justify-between flex-wrap">
    <app-action-bar
      [fullName]="userState.fullName()"
      [roles]="userState.userRoles()"
      [actions]="adminActions"
    ></app-action-bar>

    <div class="flex gap-4 overflow-x-auto scrollbar-none p-2 md:p-0">
      <app-analytics-card
        class="grow"
        variant="emerald"
        title="Ukupan prihod"
        [value]="totalRevenue()"
        icon="faSolidSackDollar"
      ></app-analytics-card>

      <app-analytics-card
        class="grow"
        variant="sky"
        title="Broj studenata"
        [value]="totalStudents()"
        icon="faSolidUserGraduate"
      ></app-analytics-card>

      <app-analytics-card
        class="grow"
        variant="violet"
        title="Održani časovi"
        [value]="completedClasses()"
        icon="faSolidChalkboardUser"
      ></app-analytics-card>

      <app-analytics-card
        class="grow"
        variant="amber"
        title="Projekti"
        [value]="completedProjects()"
        icon="faSolidFileLines"
      ></app-analytics-card>
    </div>
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-5 gap-6">
    <app-finance-chart
      [data]="financeChartData()"
      [isLoading]="isLoading()"
      [availableYears]="availableYearsForFinanceChart()"
      [selectedYear]="selectedYearForFinanceChart()"
      (selectedYearOutput)="onYearChange($event, 'finance')"
      class="min-w-0 xl:col-span-3"
    ></app-finance-chart>
    <app-subjects-chart
      [data]="subjectChartData()"
      [isLoading]="isLoading()"
      [availableYears]="availableYearsForSubjectsChart()"
      [selectedYear]="selectedYearForSubjectsChart()"
      (selectedYearOutput)="onYearChange($event, 'subjects')"
      class="min-w-0 xl:col-span-2"
    ></app-subjects-chart>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-upcoming-classes
      class="min-w-0"
      [upcomingClasses]="upcomingClasses()"
      [isLoading]="isLoading()"
    ></app-upcoming-classes>
    <app-upcoming-projects
      class="min-w-0"
      [upcomingProjects]="upcomingProjects()"
      [isLoading]="isLoading()"
    ></app-upcoming-projects>
  </div>
</div>
