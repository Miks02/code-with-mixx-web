<div
  class="flex flex-col gap-4 bg-emerald-950/80 p-4 rounded-md shadow-md relative h-full min-h-100"
>
  <h2 class="text-xl font-semibold text-emerald-100">Poslednje uplate</h2>

  @if (paymentCards().length === 0) {
  <div class="flex flex-col items-center justify-center gap-3 text-center p-4 my-auto">
    <div class="flex justify-center items-center bg-emerald-900 rounded-full h-14 w-14">
      <ng-icon name="faSolidReceipt" class="text-emerald-400! text-2xl"></ng-icon>
    </div>
    <p class="text-emerald-200 font-medium text-lg">Nije pronadjena nijedna uplata.</p>
  </div>
  } @else {
  <div class="flex flex-col gap-2 max-h-100 overflow-y-auto">
    @for (payment of paymentCards(); track payment.transactionId) {
    <div class="flex items-center gap-4 p-4 rounded-lg bg-emerald-900/80">
      <div class="flex justify-center items-center bg-emerald-800 rounded-full h-12 w-12 shrink-0">
        <ng-icon name="faSolidWallet" class="text-emerald-300! text-xl"></ng-icon>
      </div>
      <div class="flex flex-col gap-1 min-w-0 grow">
        <p class="text-white text-lg font-semibold truncate">{{ payment.title }}</p>
        <p class="text-emerald-100/90">
          {{ payment.date }} · Rezervacija #{{ payment.reservationId }}
        </p>
      </div>
      <p class="text-emerald-300 text-lg font-bold shrink-0">{{ payment.amount }}</p>
    </div>
    }
  </div>
  }
</div>
