<div
  class="rounded-xl p-6 flex flex-col gap-4 shadow-lg grow min-w-60 style().gradient"
  [class]="style().gradient"
>
  <div class="flex justify-between items-start">
    <p [class]="'font-semibold ' + style().labelColor">{{ title() }}</p>
    <div [class]="'rounded-full p-3 flex items-center justify-center ' + style().iconBg">
      <ng-icon [name]="icon()" [class]="style().iconColor + ' text-xl self-center!'"></ng-icon>
    </div>
  </div>
  <p class="text-white text-3xl font-bold">{{ value() }}</p>
</div>
