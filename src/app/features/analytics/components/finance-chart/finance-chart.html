<div
  class="bg-emerald-950 rounded-lg shadow-xl transition-shadow duration-200 hover:shadow-2xl w-full grow flex flex-col min-w-75"
>
  <div class="p-4 flex justify-between items-center">
    <h2 class="text-xl font-semibold text-white">Analiza prihoda</h2>
    <app-filter-menu
      [options]="availableYearsOptions()"
      icon="faSolidCalendar"
      [selected]="selectedYearOptions()"
      (selectedChanged)="onYearChange($event)"
      placeholder="Odaberi godinu"
    ></app-filter-menu>
  </div>
  @if (isLoading()) {
  <div class="px-4 pb-4 grow">
    <app-skeleton variant="rectangular" height="400px" />
  </div>
  } @else {
  <apx-chart
    class="w-full h-full grow"
    [series]="chartOptions().series!"
    [chart]="chartOptions().chart!"
    [xaxis]="chartOptions().xaxis!"
    [yaxis]="chartOptions().yaxis!"
    [stroke]="chartOptions().stroke!"
    [fill]="chartOptions().fill!"
    [colors]="chartOptions().colors!"
    [markers]="chartOptions().markers!"
    [dataLabels]="chartOptions().dataLabels!"
    [legend]="chartOptions().legend!"
    [tooltip]="chartOptions().tooltip!"
    [grid]="chartOptions().grid!"
    [responsive]="chartOptions().responsive!"
  ></apx-chart>
  }
</div>
