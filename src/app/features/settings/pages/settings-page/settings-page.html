<div class="flex flex-col gap-4 w-full">
  @if (userDetails(); as user) {
    <app-profile-info-card [user]="user"></app-profile-info-card>
  }

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
    <div class="flex flex-col gap-4 min-w-0">
      <app-personal-info-form></app-personal-info-form>
      <app-change-email-form></app-change-email-form>
      <app-phone-number-form></app-phone-number-form>
    </div>

    <div class="flex flex-col gap-4 min-w-0">
      <app-change-password-form></app-change-password-form>
      <app-session-actions></app-session-actions>
    </div>
  </div>
</div>

@if (isPasswordChanging()) {
  <app-loading-overlay message="U toku je izmena lozinke..." />
}
