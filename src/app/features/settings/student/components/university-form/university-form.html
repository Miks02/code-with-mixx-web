<app-panel title="Fakultet">
  <form class="flex flex-col gap-1 min-w-0" (submit)="$event.preventDefault(); onSubmit()">
    <div class="flex items-baseline justify-between gap-2 px-1">
      <label for="settings-university" class="text-xs font-semibold text-emerald-300 shrink-0"
        >Fakultet</label
      >
      @if (universityForm.university().touched() && universityForm.university().errors().length) {
        <p
          class="text-xs text-red-400 text-right truncate"
          [title]="universityForm.university().errors()[0]?.message"
        >
          {{ universityForm.university().errors()[0]?.message }}
        </p>
      }
    </div>
    <div
      class="flex items-center gap-2 bg-emerald-900/60 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-emerald-500/40 transition-200"
      [class.bg-red-950/40]="
        universityForm.university().touched() && universityForm.university().errors().length
      "
    >
      <ng-icon
        name="faSolidBuildingColumns"
        class="text-emerald-400! self-center! shrink-0"
      ></ng-icon>
      <input
        [formField]="universityForm.university"
        type="text"
        id="settings-university"
        autocomplete="organization"
        class="w-full min-w-0 border-none outline-none bg-transparent text-emerald-100 caret-emerald-100 placeholder:text-emerald-300/50"
        placeholder="Fakultet organizacionih nauka"
      />
    </div>
    <button type="submit" class="hidden" aria-label="Sačuvaj"></button>
  </form>

  <div class="flex justify-end gap-2">
    <app-button
      (clicked)="onCancel()"
      [disabled]="!universityForm().dirty()"
      variant="ghost"
      size="sm"
      icon="faSolidXmark"
      >Otkaži</app-button
    >
    <app-button
      (clicked)="onSubmit()"
      [disabled]="!universityForm().dirty() || isPending()"
      [loading]="isPending()"
      variant="primary"
      size="sm"
      icon="faSolidCheck"
      >Sačuvaj fakultet</app-button
    >
  </div>
</app-panel>
