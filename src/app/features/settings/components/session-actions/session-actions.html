<app-panel
  title="Aktivne sesije"
  description="Uređaji na kojima je tvoj nalog trenutno prijavljen."
  [count]="activeSessionsCount()"
>
  <ul class="flex flex-col gap-2 max-h-70 overflow-y-auto pr-2">
    @for (session of activeSessions(); track session.sessionId) {
      <li
        class="flex items-center gap-3 shrink-0 rounded-lg p-3 transition-200"
        [class.bg-emerald-700/40]="session.isCurrentSession"
        [class.bg-emerald-900/40]="!session.isCurrentSession"
      >
        <div
          class="flex items-center justify-center size-10 shrink-0 rounded-md"
          [class.bg-amber-500]="session.isCurrentSession"
          [class.bg-emerald-800]="!session.isCurrentSession"
        >
          <ng-icon
            [name]="deviceIcon(session.device)"
            class="text-xl"
            [class.text-amber-950!]="session.isCurrentSession"
            [class.text-emerald-300!]="!session.isCurrentSession"
          ></ng-icon>
        </div>

        <div class="flex flex-col min-w-0 flex-1">
          <div class="flex items-center gap-2 min-w-0">
            <p class="text-sm font-semibold text-emerald-100 truncate">
              {{ session.browser }} · {{ session.os }}
            </p>
            @if (session.isCurrentSession) {
              <app-badge
                class="hidden md:block"
                text="Ovaj uređaj"
                color="bg-amber-500/20 text-amber-400"
              />
            }
          </div>
          <p class="text-xs text-emerald-300/80">Aktivna od: {{ session.activeSince | srDate }}</p>
        </div>

        <app-button
          (clicked)="onLogout(session)"
          [loading]="isLoggingOut(session)"
          variant="ghost"
          size="sm"
          icon="faSolidArrowRightFromBracket"
          >Odjavi</app-button
        >
      </li>
    } @empty {
      <li class="text-sm text-emerald-300/80 text-center py-2">Nema aktivnih sesija.</li>
    }
  </ul>

  <app-button
    (clicked)="onLogoutAllDevices()"
    [fullWidth]="true"
    variant="danger"
    icon="faSolidPowerOff"
    >Odjavi se sa svih uređaja</app-button
  >
</app-panel>
