@if (isVisible()) {
  <div
    animate.enter="backdrop-in"
    (click)="onClose()"
    class="fixed inset-0 z-1000 flex items-center justify-center bg-emerald-900/60 backdrop-blur-xs"
  ></div>

  <div
    animate.enter="modal-in"
    class="flex flex-col p-6 gap-6 w-[calc(100%-2rem)] max-w-sm max-h-[calc(100dvh-2rem)] overflow-y-auto bg-emerald-200 rounded-xl z-1000 fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 shadow-lg"
  >
    <div class="flex justify-end -mb-4">
      <button
        type="button"
        aria-label="Zatvori"
        (click)="onClose()"
        class="text-2xl text-red-900 cursor-pointer hover:opacity-70 active:opacity-50 transition-200"
      >
        <ng-icon name="faSolidXmark"></ng-icon>
      </button>
    </div>

    <div class="flex flex-col items-center gap-3 text-center">
      <div
        class="flex items-center justify-center size-14 rounded-full bg-emerald-700 text-emerald-100 text-2xl shadow-lg"
      >
        <ng-icon name="faSolidEnvelopeOpenText"></ng-icon>
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-xl font-semibold text-emerald-900">Potvrdi email</p>
        <p class="text-sm text-emerald-900/70">
          Unesi kod od 6 cifara koji je stigao na tvoju trenutnu email adresu.
        </p>
      </div>
    </div>

    <form class="flex flex-col gap-2" (submit)="$event.preventDefault(); onSubmit()">
      <label for="token" class="sr-only">Kod za potvrdu</label>
      <input
        [formField]="tokenForm.token"
        type="text"
        id="token"
        inputmode="numeric"
        autocomplete="one-time-code"
        class="w-full bg-emerald-700 rounded-lg shadow-lg px-4 py-4 text-center text-3xl font-mono font-semibold tracking-[0.5em] indent-[0.5em] text-white caret-white placeholder:text-emerald-100/30 outline-none focus:ring-2 focus:ring-amber-500 transition-200"
        [class.ring-2]="tokenForm.token().touched() && tokenForm.token().errors().length"
        [class.ring-red-400]="tokenForm.token().touched() && tokenForm.token().errors().length"
        placeholder="000000"
      />
      <p class="min-h-4 text-xs text-red-600 text-center">
        @if (tokenForm.token().touched() && tokenForm.token().errors().length) {
          {{ tokenForm.token().errors()[0]?.message }}
        }
      </p>
    </form>

    <div class="flex gap-2">
      <app-button
        class="flex-1"
        size="sm"
        [fullWidth]="true"
        variant="secondary"
        (click)="onClose()"
      >
        Odustani
      </app-button>
      <app-button
        class="flex-1"
        [fullWidth]="true"
        size="sm"
        icon="faSolidCheck"
        [loading]="changeEmailMutation.isPending()"
        (click)="onSubmit()"
      >
        Potvrdi
      </app-button>
    </div>
  </div>
}
