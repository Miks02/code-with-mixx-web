<div class="bg-emerald-950/80 rounded-md shadow-md p-4 flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <h2 class="text-lg font-semibold text-emerald-100">Broj telefona</h2>
    <p class="text-sm text-emerald-300">Koristi se kada je potrebno da te neko brzo kontaktira.</p>
  </div>

  <form class="flex flex-col gap-1 min-w-0" (submit)="$event.preventDefault(); onSubmit()">
    <div class="flex items-baseline justify-between gap-2 px-1">
      <label for="settings-phoneNumber" class="text-xs font-semibold text-emerald-300 shrink-0"
        >Telefon</label
      >
      @if (
        phoneNumberForm.phoneNumber().touched() && phoneNumberForm.phoneNumber().errors().length
      ) {
        <p
          class="text-xs text-red-400 text-right truncate"
          [title]="phoneNumberForm.phoneNumber().errors()[0]?.message"
        >
          {{ phoneNumberForm.phoneNumber().errors()[0]?.message }}
        </p>
      }
    </div>
    <div
      class="flex items-center gap-2 bg-emerald-900/60 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-emerald-500/40 transition-200"
      [class.bg-red-950/40]="
        phoneNumberForm.phoneNumber().touched() && phoneNumberForm.phoneNumber().errors().length
      "
    >
      <ng-icon name="faSolidPhone" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <input
        [formField]="phoneNumberForm.phoneNumber"
        type="tel"
        id="settings-phoneNumber"
        autocomplete="tel"
        class="w-full min-w-0 border-none outline-none bg-transparent text-emerald-100 caret-emerald-100 placeholder:text-emerald-300/50"
        placeholder="+381 64 123 4567"
      />
    </div>
    <button type="submit" class="hidden" aria-label="Sačuvaj"></button>
  </form>

  <div class="flex justify-end gap-2">
    <app-button
      (clicked)="onCancel()"
      [disabled]="!phoneNumberForm().dirty()"
      variant="ghost"
      size="sm"
      icon="faSolidXmark"
      >Otkaži</app-button
    >
    <app-button
      (clicked)="onSubmit()"
      [disabled]="!phoneNumberForm().dirty() || isPending()"
      [loading]="isPending()"
      variant="primary"
      size="sm"
      icon="faSolidCheck"
      >Sačuvaj telefon</app-button
    >
  </div>
</div>
