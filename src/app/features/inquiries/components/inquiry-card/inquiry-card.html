<div
  [class]="containerClasses()"
  role="button"
  tabindex="0"
  [attr.aria-pressed]="isSelected()"
  (click)="onClick()"
  (keydown.enter)="onClick()"
  (keydown.space)="$event.preventDefault(); onClick()"
  [style]="addOpacity() ? { opacity: 0.5 } : null"
>
  <div class="flex gap-3 items-center">
    <button
      type="button"
      role="checkbox"
      [attr.aria-checked]="isChecked()"
      [attr.aria-label]="'Označi upit: ' + fullName()"
      (click)="onCheckboxClick($event)"
      class="flex justify-center items-center h-5 w-5 shrink-0 rounded border-2 cursor-pointer transition-200 active:scale-95"
      [class]="checkboxClasses()"
    >
      @if (isChecked()) {
        <ng-icon name="faSolidCheck" class="text-xs text-emerald-950! self-center!"></ng-icon>
      }
    </button>

    <div class="flex justify-center items-center rounded-full h-10 w-10 shrink-0 bg-emerald-500">
      <span class="text-sm font-semibold text-emerald-950">{{ initials() }}</span>
    </div>

    <div class="flex flex-col min-w-0 flex-1">
      <p class="text-emerald-100 font-semibold truncate">{{ fullName() }}</p>
      <p class="text-sm truncate text-emerald-300">{{ inquiryType() }}</p>
    </div>

    <span
      class="text-xs font-semibold px-2 py-1 rounded-full shrink-0"
      [class]="status().classes"
      >{{ status().label }}</span
    >
  </div>

  <p class="text-sm text-emerald-100/70 line-clamp-2 wrap-break-word">{{ inquiry().message }}</p>

  <div
    class="flex flex-col md:flex-row md:flex-wrap gap-x-4 gap-y-1 border-t border-emerald-700/40 pt-2 text-xs text-emerald-300"
  >
    <div class="flex items-center gap-1.5 min-w-0">
      <ng-icon name="faSolidEnvelope" class="self-center! shrink-0 text-emerald-400!"></ng-icon>
      <span class="font-semibold text-emerald-100 truncate">{{ inquiry().email }}</span>
    </div>
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarPlus" class="self-center! shrink-0 text-emerald-400!"></ng-icon>
      <span>Poslat</span>
      <span class="font-semibold text-emerald-100">{{ inquiry().createdAt | srDate }}</span>
    </div>
  </div>
</div>
