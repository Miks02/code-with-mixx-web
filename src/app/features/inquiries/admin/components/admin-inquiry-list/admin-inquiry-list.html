<app-paged-list
  class="h-full min-h-80"
  title="Upiti"
  emptyMessage="Nije pronađen nijedan upit. Promeni filtere ili pretragu."
  [page]="store.inquiriesQuery.data()"
  [isPending]="store.inquiriesPending()"
  (previousPage)="store.previousPage()"
  (nextPage)="store.nextPage()"
>
  <ng-container filters>
    <app-filter-container>
      <app-filter-menu
        placeholder="Status"
        [icon]="'faSolidCircleCheck'"
        [options]="statusOptions"
        [conflictingOptions]="conflictingStatusOptions"
        [selected]="store.selectedStatusFilters()"
        (selectedChanged)="store.setStatusFilters($event)"
      ></app-filter-menu>

      <app-filter-menu
        placeholder="Vrsta upita"
        [icon]="'faSolidLayerGroup'"
        [options]="typeOptions"
        [selected]="store.selectedTypeFilters()"
        (selectedChanged)="store.setTypeFilters($event)"
      ></app-filter-menu>
    </app-filter-container>

    <app-sort-menu
      [options]="sortOptions"
      [selected]="store.params.sortBy()"
      (sortChanged)="store.setSort($event)"
    ></app-sort-menu>

    <app-search-bar
      placeholder="Pretraži upite"
      (searchTerm)="store.setSearchTerm($event)"
    ></app-search-bar>
  </ng-container>

  <div class="col-span-full flex items-center justify-between gap-3 flex-wrap min-h-8">
    <button
      type="button"
      role="checkbox"
      [attr.aria-checked]="store.areAllChecked()"
      (click)="store.toggleAllChecked()"
      class="flex items-center gap-2 text-sm text-emerald-100 cursor-pointer"
    >
      <span
        class="flex justify-center items-center h-5 w-5 shrink-0 rounded border-2 transition-200"
        [class]="selectAllClasses()"
      >
        @if (store.areAllChecked()) {
          <ng-icon name="faSolidCheck" class="text-xs text-emerald-950! self-center!"></ng-icon>
        }
      </span>
      Označi sve na strani
    </button>

    @if (store.checkedCount()) {
      <div class="flex items-center gap-3">
        <span class="text-sm text-emerald-300">Označeno: {{ store.checkedCount() }}</span>
        <app-button
          variant="danger"
          size="sm"
          icon="faSolidTrash"
          [loading]="store.isBulkDeleting()"
          (clicked)="onDeleteChecked()"
          >Obriši označene</app-button
        >
      </div>
    }
  </div>

  @for (inquiry of store.pagedItems(); track inquiry.id) {
    <app-inquiry-card
      [inquiry]="inquiry"
      [addOpacity]="store.inquiriesFetching()"
      [isSelected]="inquiry.id === store.selectedInquiryId()"
      [isChecked]="isChecked(inquiry.id)"
      (selected)="store.selectInquiry($event)"
      (checkedToggled)="store.toggleChecked($event)"
    ></app-inquiry-card>
  }
</app-paged-list>
