<div
  class="grid grid-cols-1 lg:grid-cols-5 lg:grid-rows-[minmax(0,1fr)_auto] w-full lg:h-full gap-4"
>
  <app-admin-inquiry-list class="min-w-0 lg:col-span-3"></app-admin-inquiry-list>

  <app-inquiry-details
    [appScrollIntoViewOn]="store.detailsScrollRequests()"
    class="min-w-0 lg:col-span-2"
  ></app-inquiry-details>

  <div class="min-w-0 lg:col-span-5 grid grid-cols-1 sm:grid-cols-3 gap-4">
    <app-stats-card
      title="Upiti"
      icon="faSolidEnvelope"
      iconBackground="sky"
      description="Ukupno"
      [value]="store.summary()?.totalInquiries"
      [isPending]="store.summaryPending()"
    ></app-stats-card>

    <app-stats-card
      title="Nerešeni"
      icon="faSolidHourglassHalf"
      iconBackground="amber"
      description="Upiti koji čekaju odgovor"
      [value]="store.summary()?.unresolvedInquiries"
      [isPending]="store.summaryPending()"
    ></app-stats-card>

    <app-stats-card
      title="Rešeni"
      icon="faSolidCircleCheck"
      iconBackground="emerald"
      description="Upiti na koje je odgovoreno"
      [value]="store.summary()?.resolvedInquiries"
      [isPending]="store.summaryPending()"
    ></app-stats-card>
  </div>
</div>
