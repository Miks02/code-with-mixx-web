<section id="testimonials" class="w-full bg-emerald-950 py-12 lg:py-16 3xl:py-24">
  <div class="mx-auto w-full max-w-7xl px-6 lg:px-10 3xl:max-w-[110rem]">
    <div class="grid gap-5 lg:grid-cols-2 lg:items-end lg:gap-20 3xl:gap-32">
      <h2 class="text-3xl leading-tight font-bold text-white sm:text-4xl lg:text-5xl 3xl:text-6xl">
        Utisci
        <span class="block text-emerald-300">studenata</span>
      </h2>

      <div>
        <p class="max-w-xl text-lg text-emerald-50/90 sm:text-xl 3xl:max-w-2xl 3xl:text-2xl">
          Šta kažu neki od kolega sa kojima sam imao prilike da radim.
        </p>
      </div>
    </div>

    <ul
      class="mt-12 grid gap-6 sm:grid-cols-2 lg:mt-16 lg:grid-cols-3 xl:grid-cols-4 3xl:mt-24 3xl:gap-10"
    >
      @for (testimonial of testimonials; track testimonial.name) {
        <li>
          <figure class="flex h-full flex-col rounded-lg bg-emerald-900 p-6 shadow-lg 3xl:p-8">
            <ng-icon
              name="faSolidQuoteLeft"
              class="text-2xl text-emerald-300! 3xl:text-3xl"
              aria-hidden="true"
            ></ng-icon>

            <blockquote class="mt-4 mb-6 text-base text-emerald-100 3xl:mt-6 3xl:mb-8 3xl:text-xl">
              <p>{{ testimonial.quote }}</p>
            </blockquote>

            <figcaption
              class="mt-auto flex items-center gap-3 border-t border-emerald-700/40 pt-5 3xl:gap-4 3xl:pt-7"
            >
              <span
                class="flex size-11 shrink-0 items-center justify-center rounded-full bg-emerald-800 text-sm font-semibold text-emerald-300 3xl:size-14 3xl:text-lg"
                aria-hidden="true"
                >{{ testimonial.initials }}</span
              >
              <span>
                <span class="block font-semibold text-white 3xl:text-xl">{{
                  testimonial.name
                }}</span>
                <span class="block text-sm text-emerald-100/70 3xl:text-lg">{{
                  testimonial.subject
                }}</span>
              </span>
            </figcaption>
          </figure>
        </li>
      }
    </ul>
  </div>
</section>
