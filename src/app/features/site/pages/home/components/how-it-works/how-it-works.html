<section class="w-full bg-emerald-950 py-12 lg:py-16 3xl:py-24">
  <div class="mx-auto w-full max-w-7xl px-6 lg:px-10 3xl:max-w-[110rem]">
    <div class="grid gap-5 lg:grid-cols-2 lg:items-end lg:gap-20 3xl:gap-32">
      <h2 class="text-3xl leading-tight font-bold text-white sm:text-4xl lg:text-5xl 3xl:text-6xl">
        Princip rada
        <span class="block text-emerald-300">u četiri koraka</span>
      </h2>

      <p class="max-w-xl text-lg text-emerald-50/90 sm:text-xl 3xl:max-w-2xl 3xl:text-2xl">
        Jednostavan put od prvog kontakta do položenog ispita.
      </p>
    </div>

    <div class="track relative mt-12 ml-1.5 lg:mt-16 lg:ml-0 3xl:mt-24">
      <span
        class="track-fill absolute top-0 left-0 h-full w-px bg-emerald-400 lg:h-px lg:w-full"
        aria-hidden="true"
      ></span>

      <ol class="border-l border-emerald-700/40 lg:grid lg:grid-cols-4 lg:border-t lg:border-l-0">
        @for (step of steps; track step.title) {
          <li
            class="relative pb-10 pl-7 last:pb-0 sm:pl-9 lg:pt-9 lg:pr-10 lg:pb-0 lg:pl-0 3xl:pt-12"
          >
            <span
              class="absolute top-3 -left-1.5 size-3 rounded-sm lg:-top-1.5 lg:left-0"
              [class]="$last ? 'bg-amber-500' : 'bg-emerald-400'"
              aria-hidden="true"
            ></span>

            <div class="flex items-center gap-4" aria-hidden="true">
              <span
                class="text-4xl font-bold lg:text-5xl 3xl:text-6xl"
                [class]="$last ? 'text-amber-400' : 'text-white'"
              >
                0{{ $index + 1 }}
              </span>
              <ng-icon [name]="step.icon" class="text-xl text-emerald-300! 3xl:text-2xl"></ng-icon>
            </div>

            <h3 class="mt-4 text-xl font-bold text-white sm:text-2xl 3xl:mt-6 3xl:text-3xl">
              {{ step.title }}
            </h3>

            <p class="mt-2 max-w-xl text-base text-emerald-100 3xl:mt-3 3xl:text-xl">
              {{ step.description }}
            </p>
          </li>
        }
      </ol>
    </div>

    <p class="mt-12 flex items-center gap-3 text-emerald-100/70 lg:mt-16 3xl:mt-24 3xl:text-xl">
      <ng-icon name="faSolidVideo" class="shrink-0 text-emerald-300!" aria-hidden="true"></ng-icon>
      Časovi se održavaju online, putem Google Meet-a ili Discorda.
    </p>
  </div>
</section>
