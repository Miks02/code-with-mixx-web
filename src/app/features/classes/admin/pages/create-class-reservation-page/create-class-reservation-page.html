<div class="grid grid-cols-1 lg:grid-cols-3 w-full gap-4 items-start">
  <div class="w-full flex justify-between flex-wrap lg:col-span-3">
    <div class="flex gap-2 text-emerald-100 items-center">
      <a routerLink="/admin/classes" class="text-emerald-200">Časovi</a>
      <span>/</span>
      <p>Nova rezervacija</p>
    </div>

    <app-button routerLink="/admin/classes" variant="ghost">
      <span class="md:block hidden">Nazad na časove</span>
      <span class="md:hidden">Nazad</span>
    </app-button>
  </div>

  <div class="flex flex-col gap-4 min-w-0 lg:col-span-2">
    <app-reservation-pricing
      [reservationStatus]="formService.reservationForm.reservationStatus"
      [totalPrice]="formService.reservationForm.totalPrice"
      [itemsTotal]="formService.itemsTotal()"
      [useItemsSum]="formService.useItemsSum()"
      [totalPaid]="store.totalPaid()"
      sumLabel="Zbir časova"
      sumHint="Računa se automatski iz cena časova."
      (useItemsSumChanged)="formService.setUseItemsSum($event)"
    ></app-reservation-pricing>

    <app-class-reservation-list-form></app-class-reservation-list-form>
  </div>

  <div class="min-w-0 gap-4 flex flex-col">
    <app-student-selection
      [availableStudents]="store.availableStudents()"
      [selectedStudent]="store.selectedStudent()"
      (studentSelected)="store.selectStudent($event)"
    ></app-student-selection>
    <app-reservation-summary
      [totalPrice]="formService.totalPrice()"
      [itemsTotal]="formService.itemsTotal()"
      [totalPaid]="store.totalPaid() ?? 0"
      [reservedAt]="formService.reservationForm.reservedAt"
      [description]="formService.reservationForm.description"
      [checks]="formService.checks()"
      [canSave]="formService.reservationForm().valid()"
      [isSaving]="store.isSaving()"
      (saved)="formService.save(store.reservationId())"
      (formReset)="formService.reset()"
    ></app-reservation-summary>
  </div>
</div>
