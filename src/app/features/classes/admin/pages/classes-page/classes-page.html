<div class="grid grid-cols-1 lg:grid-cols-5 lg:grid-rows-3 w-full lg:h-full gap-4">
  <app-class-reservations-list
    class="min-w-0 lg:col-span-3 lg:row-span-2"
    [pagedReservations]="reservationsData()"
    [selectedReservationId]="selectedReservation()?.id"
    [subjects]="subjectsLookupData()"
    [selectedSubjectIds]="queryParams().subjectIds"
    [selectedReservationStatuses]="queryParams().reservationStatuses"
    [selectedPaymentStatuses]="queryParams().paymentStatuses"
    [showOnlyDeletedReservations]="queryParams().showOnlyDeletedReservations"
    [showOnlyDeletedStudents]="queryParams().showOnlyDeletedStudents"
    [isPending]="reservationsPending()"
    [isFetching]="reservationsFetching()"
    (reservationSelected)="onReservationSelected($event)"
    (paymentStatusesChanged)="onPaymentStatusesChange($event)"
    (subjectIdsChanged)="onSubjectIdsChange($event)"
    (deletedReservationsToggled)="onDeletedReservationsToggle($event)"
    (reservationStatusesChanged)="onReservationStatusesChange($event)"
    (deletedStudentsToggled)="onDeletedStudentsToggle($event)"
    (pageChanged)="onPageChange($event)"
  ></app-class-reservations-list>
</div>
