<div
  tabindex="0"
  [attr.aria-label]="'Detalji časa ' + class().subjectName"
  class="p-3 rounded-lg bg-emerald-900/80 flex flex-col gap-2.5 transition-200"
>
  <div class="flex items-center justify-between gap-3 min-w-0">
    <div class="flex items-center gap-2 min-w-0">
      <p class="text-emerald-100 font-semibold truncate">{{ class().subjectName }}</p>
    </div>
    <span class="text-sm font-semibold text-emerald-100 shrink-0">{{ priceLabel() }}</span>
  </div>

  <div
    class="flex flex-wrap gap-x-4 gap-y-1 border-t border-emerald-700/40 pt-2 text-xs text-emerald-300"
  >
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarDays" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <span>Zakazan</span>
      <span class="font-semibold text-emerald-100">{{ class().startsAt | srDate }}</span>
      <span class="font-semibold text-emerald-100"
        >{{ startsAtLabel() }} - {{ endsAtLabel() }}</span
      >
    </div>
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarPlus" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <span>Rezervisan</span>
      <span class="font-semibold text-emerald-100">{{ class().reservedAt | srDate }}</span>
    </div>
  </div>
</div>
