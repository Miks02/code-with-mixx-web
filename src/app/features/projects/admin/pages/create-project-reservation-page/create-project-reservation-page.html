<div class="grid grid-cols-3 w-full gap-4">
  <div class="w-full flex justify-between flex-wrap col-span-3">
    <div class="flex gap-2 text-emerald-100 items-center">
      <a routerLink="/admin/projects" class="text-emerald-200">Projekti</a>
      <span>/</span>
      <p>Nova rezervacija</p>
    </div>

    <app-button routerLink="/admin/projects" variant="ghost">
      <span class="md:block hidden">Nazad na projekte</span>
      <span class="md:hidden">Nazad</span>
    </app-button>
  </div>

  <app-project-reservation-list-form
    [subjectsLookup]="subjectsLookup()"
    class="col-span-2"
  ></app-project-reservation-list-form>

  <app-student-selection
    [availableStudents]="availableStudents()"
    [selectedStudent]="selectedStudent()"
    (studentSelected)="onStudentSelected($event)"
  ></app-student-selection>
</div>
