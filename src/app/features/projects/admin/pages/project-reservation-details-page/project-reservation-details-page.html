<div class="grid grid-cols-1 lg:grid-cols-3 w-full gap-4 items-start">
  <div class="w-full flex justify-between flex-wrap lg:col-span-3">
    <div class="flex gap-2 text-emerald-100 items-center">
      <a routerLink="/admin/projects" class="text-emerald-200">Projekti</a>
      <span>/</span>
      <p>Detalji rezervacije</p>
    </div>

    <app-button routerLink="/admin/projects" variant="ghost">
      <span class="md:block hidden">Nazad na projekte</span>
      <span class="md:hidden">Nazad</span>
    </app-button>
  </div>

  <div class="flex flex-col gap-4 min-w-0 lg:col-span-2">
    <app-project-reservation-pricing [disablePaidAmount]="true"></app-project-reservation-pricing>

    <app-project-reservation-list-form
      [subjectsLookup]="subjectsLookup()"
    ></app-project-reservation-list-form>
  </div>

  <div class="min-w-0 gap-4 flex flex-col">
    <app-student-selection
      [availableStudents]="availableStudents()"
      [selectedStudent]="selectedStudent()"
      (studentSelected)="onStudentSelected($event)"
    ></app-student-selection>
    <app-project-reservation-summary (submitClicked)="onSubmit()"></app-project-reservation-summary>
  </div>
</div>
