<app-paged-list
  class="h-full min-h-120"
  title="Projekti"
  emptyMessage="Nije pronadjena nijedna rezervacija projekta. Promeni filtere."
  [page]="store.reservationsQuery.data()"
  [isPending]="store.reservationsPending()"
  (previousPage)="store.previousPage()"
  (nextPage)="store.nextPage()"
>
  <ng-container filters>
    <app-button
      variant="ghost"
      size="sm"
      icon="faSolidUserSlash"
      [class]="
        store.params.showOnlyDeletedStudents()
          ? 'hidden xl:inline-flex self-center bg-emerald-700 rounded-lg'
          : 'hidden xl:inline-flex self-center'
      "
      [attr.aria-pressed]="store.params.showOnlyDeletedStudents()"
      (click)="store.toggleDeletedStudents()"
    >
    </app-button>
    <app-button
      variant="ghost"
      size="sm"
      icon="faSolidBoxArchive"
      [class]="
        store.params.showOnlyDeletedReservations()
          ? 'hidden xl:inline-flex self-center bg-emerald-700 rounded-lg'
          : 'hidden xl:inline-flex self-center'
      "
      [attr.aria-pressed]="store.params.showOnlyDeletedReservations()"
      (click)="store.toggleDeletedReservations()"
    >
    </app-button>

    <button
      type="button"
      aria-label="Obrisani studenti"
      [attr.aria-pressed]="store.params.showOnlyDeletedStudents()"
      (click)="store.toggleDeletedStudents()"
      [class]="store.params.showOnlyDeletedStudents() ? 'border-amber-500' : 'border-emerald-400'"
      class="xl:hidden shrink-0 rounded-full bg-emerald-700 p-2 flex justify-center items-center border-2 cursor-pointer shadow-lg active:scale-95 transition-200"
    >
      <ng-icon name="faSolidUserSlash" class="text-emerald-300! self-center!"></ng-icon>
    </button>

    <button
      type="button"
      aria-label="Arhivirane rezervacije"
      [attr.aria-pressed]="store.params.showOnlyDeletedReservations()"
      (click)="store.toggleDeletedReservations()"
      [class]="
        store.params.showOnlyDeletedReservations() ? 'border-amber-500' : 'border-emerald-400'
      "
      class="xl:hidden shrink-0 rounded-full bg-emerald-700 p-2 flex justify-center items-center border-2 cursor-pointer shadow-lg active:scale-95 transition-200"
    >
      <ng-icon name="faSolidBoxArchive" class="text-emerald-300! self-center!"></ng-icon>
    </button>

    <app-filter-container>
      <app-filter-menu
        placeholder="Predmet"
        [icon]="'faSolidBook'"
        [options]="subjectOptions()"
        [selected]="selectedSubjectOptions()"
        (selectedChanged)="onSubjectsChanged($event)"
      ></app-filter-menu>

      <app-filter-menu
        placeholder="Tip projekta"
        [icon]="'faSolidLayerGroup'"
        [options]="projectTypes"
        [selected]="store.params.projectTypes()"
        (selectedChanged)="store.setProjectTypes($event)"
      ></app-filter-menu>

      <app-filter-menu
        placeholder="Status rezervacije"
        [icon]="'faSolidChartDiagram'"
        [options]="reservationStatuses"
        [conflictingOptions]="conflictingReservationStatuses"
        [selected]="store.params.reservationStatuses()"
        (selectedChanged)="store.setReservationStatuses($event)"
      ></app-filter-menu>
      <app-filter-menu
        placeholder="Status plaćanja"
        [icon]="'faSolidMoneyBillTransfer'"
        [options]="paymentStatuses"
        [selected]="store.params.paymentStatuses()"
        (selectedChanged)="store.setPaymentStatuses($event)"
      ></app-filter-menu>
    </app-filter-container>

    <app-button
      class="hidden xl:inline-flex self-center"
      variant="primary"
      size="sm"
      icon="faSolidPlus"
      aria-label="Dodaj projekat"
      (clicked)="onOpenCreationForm()"
    >
    </app-button>

    <button
      type="button"
      aria-label="Dodaj projekat"
      (click)="onOpenCreationForm()"
      class="xl:hidden shrink-0 rounded-full bg-emerald-700 p-2 flex justify-center items-center border-2 border-emerald-400 cursor-pointer shadow-lg active:scale-95 transition-200"
    >
      <ng-icon name="faSolidPlus" class="text-emerald-300! self-center!"></ng-icon>
    </button>
  </ng-container>

  @for (reservation of store.reservations(); track reservation.id) {
    <app-project-reservation-card
      [reservation]="reservation"
      [addOpacity]="store.reservationsFetching()"
      [isSelected]="reservation.id === store.selectedReservationId()"
      (selected)="store.selectReservation($event)"
    ></app-project-reservation-card>
  }
</app-paged-list>
