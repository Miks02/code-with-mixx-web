<div
  [class]="containerClasses()"
  (click)="onClick()"
  [style]="addOpacity() ? { opacity: 0.5 } : null"
>
  <div class="flex gap-3 items-center">
    <div
      class="flex justify-center items-center rounded-full h-10 w-10 shrink-0"
      [class]="accentColor().avatar"
    >
      <span class="text-sm font-semibold" [class]="accentColor().initials">{{
        studentInitials()
      }}</span>
    </div>
    <div class="flex flex-col min-w-0 flex-1">
      <p class="text-emerald-100 font-semibold truncate">{{ reservation().studentFullName }}</p>
      <p class="text-sm truncate" [class]="accentColor().mutedText">{{ subjectNames() }}</p>
    </div>
    <span
      class="text-xs font-semibold px-2 py-1 rounded-full shrink-0"
      [class]="paymentStatus().classes"
      >{{ paymentStatus().label }}</span
    >
  </div>

  <div
    class="flex flex-col md:flex-row md:flex-wrap gap-x-4 gap-y-1 border-t pt-2 text-xs"
    [class]="[accentColor().border, accentColor().mutedText]"
  >
    @for (stat of stats(); track stat.label) {
      <div class="flex items-center gap-1.5">
        <ng-icon
          [name]="stat.icon"
          class="self-center! shrink-0"
          [class]="accentColor().icon"
        ></ng-icon>
        <span>{{ stat.label }}</span>
        <span class="font-semibold text-emerald-100">{{ stat.value }}</span>
      </div>
    }
    <div class="flex items-center gap-1.5">
      <ng-icon
        name="faSolidCalendarPlus"
        class="self-center! shrink-0"
        [class]="accentColor().icon"
      ></ng-icon>
      <span>Kreirana</span>
      <span class="font-semibold text-emerald-100">{{
        reservation().createdAt | date: 'dd.MM.yyyy'
      }}</span>
    </div>
  </div>
</div>
