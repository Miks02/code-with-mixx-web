<div class="p-3 rounded-lg bg-emerald-900/80 flex flex-col gap-2.5">
  <div class="flex items-center justify-between gap-3 min-w-0">
    <div class="flex items-center gap-2 min-w-0">
      <p class="text-emerald-100 font-semibold truncate">{{ project().subjectName }}</p>
      <span
        class="text-xs font-semibold px-2 py-0.5 rounded-full shrink-0 bg-emerald-700/70 text-emerald-100"
        >{{ projectTypeLabel() }}</span
      >
    </div>
    <span class="text-sm font-semibold text-emerald-100 shrink-0">{{ priceLabel() }}</span>
  </div>

  <div class="flex flex-col gap-1">
    <div class="flex items-center justify-between text-xs text-emerald-300">
      <span>Napredak</span>
      <span class="font-semibold text-emerald-100">{{ progress() }}%</span>
    </div>
    <div class="h-1.5 w-full rounded-full bg-emerald-950 overflow-hidden">
      <div class="h-full rounded-full bg-emerald-400" [style.width.%]="progress()"></div>
    </div>
  </div>

  <div
    class="flex flex-wrap gap-x-4 gap-y-1 border-t border-emerald-700/40 pt-2 text-xs text-emerald-300"
  >
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarDays" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <span>Rok</span>
      <span class="font-semibold text-emerald-100"
        >{{ project().startDate | date: 'dd.MM.yyyy' }} -
        {{ project().endDate | date: 'dd.MM.yyyy' }}</span
      >
    </div>
    <div class="flex items-center gap-1.5">
      <ng-icon name="faSolidCalendarPlus" class="text-emerald-400! self-center! shrink-0"></ng-icon>
      <span>Rezervisan</span>
      <span class="font-semibold text-emerald-100">{{
        project().reservedAt | date: 'dd.MM.yyyy'
      }}</span>
    </div>
  </div>
</div>
