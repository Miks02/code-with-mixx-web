<button
  type="button"
  [class]="containerClasses()"
  (click)="selected.emit()"
  [style]="addOpacity() ? { opacity: 0.5 } : null"
>
  <div class="flex gap-3 items-center">
    <div class="flex justify-center items-center bg-emerald-500 rounded-full h-10 w-10 shrink-0">
      <span class="text-sm font-semibold text-emerald-950">IP</span>
    </div>
    <div class="flex flex-col min-w-0">
      <p class="text-emerald-100 font-semibold truncate">{{ subjectName() }}</p>
      <p class="text-emerald-300 text-sm truncate">{{ subjectDescription() }}</p>
    </div>
  </div>
  @if (classesCount() !== undefined || studentsCount() !== undefined) {
    <div class="flex items-center gap-3 border-t border-emerald-700/40 pt-2 text-amber-300 text-sm">
      @if (classesCount() !== undefined) {
        <div class="flex items-center gap-1">
          <ng-icon name="faSolidCalendar" class="text-amber-300! text-base self-center!"></ng-icon>
          <span
            >Časovi: <span class="text-emerald-100">{{ classesCount() }}</span></span
          >
        </div>
      }
      @if (studentsCount() !== undefined) {
        <div class="flex items-center gap-1">
          <ng-icon
            name="faSolidUserGraduate"
            class="text-amber-300! text-base self-center!"
          ></ng-icon>
          <span
            >Studenti: <span class="text-emerald-100">{{ studentsCount() }}</span></span
          >
        </div>
      }
    </div>
  }
</button>
