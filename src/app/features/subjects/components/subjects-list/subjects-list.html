<div
  class="bg-emerald-950/80 backdrop-blur-xl rounded-lg shadow-lg p-4 flex flex-col gap-3 h-full min-h-80"
>
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <h2 class="text-xl font-semibold text-emerald-100">Predmeti</h2>

    <div
      class="flex items-center gap-2 bg-emerald-900/80 rounded-lg px-3 py-2 flex-1 min-w-40 max-w-64"
    >
      <ng-icon
        name="faSolidMagnifyingGlass"
        class="text-emerald-400! text-sm self-center!"
      ></ng-icon>
      <input
        type="text"
        (input)="onSearchInput($event)"
        class="w-full bg-transparent outline-none text-sm text-emerald-100 placeholder:text-emerald-100/50"
        placeholder="Pretraži predmete..."
      />
    </div>
  </div>

  @if (subjects()?.length) {

  <div class="flex flex-wrap content-start gap-3 h-80 overflow-y-auto">
    @for (subject of subjects(); track subject.id) {
    <app-subject-card
      class="w-full sm:w-[calc(50%-0.375rem)]"
      [subject]="subject"
      [isSelected]="subject.id === selectedSubjectId()"
      (selected)="onSubjectSelected($event)"
    ></app-subject-card>
    }
  </div>
  } @else {
  <p class="text-emerald-300 text-sm text-center py-6">Trenutno nema unetih predmeta.</p>
  }

  <div class="flex items-center justify-between gap-3 flex-wrap mt-auto pt-2">
    <p class="text-emerald-300 text-sm">Prikazano {{ paginatedCount() }} od {{ totalCount() }}</p>

    <div class="flex items-center gap-2">
      <app-button
        variant="ghost"
        size="sm"
        icon="faSolidChevronLeft"
        [disabled]="!hasPreviousPage()"
        (click)="onPreviousPage()"
      ></app-button>

      <span class="text-emerald-100 text-sm">{{ currentPage() }} / {{ totalPages() }}</span>

      <app-button
        variant="ghost"
        size="sm"
        icon="faSolidChevronRight"
        [disabled]="!hasNextPage()"
        (click)="onNextPage()"
      ></app-button>
    </div>
  </div>
</div>
