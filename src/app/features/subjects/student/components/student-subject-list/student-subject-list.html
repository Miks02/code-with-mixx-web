<app-paged-list
  title="Predmeti"
  emptyMessage="Nije pronađen nijedan predmet."
  [page]="store.pagedSubjects()"
  [isPending]="store.subjectsPending()"
  (previousPage)="store.previousPage()"
  (nextPage)="store.nextPage()"
>
  <ng-container filters>
    <app-sort-menu
      [options]="sort"
      [selected]="store.params.sortBy()"
      (sortChanged)="store.setSort($event)"
    ></app-sort-menu>

    <app-search-bar
      placeholder="Pretraži predmete"
      (searchTerm)="store.setSearchTerm($event)"
    ></app-search-bar>
  </ng-container>

  <ng-container>
    @for (subject of store.pagedSubjectsItems(); track subject.id) {
      <app-subject-card
        [subjectName]="subject.subjectName"
        [subjectDescription]="subject.subjectDescription"
        [classesCount]="subject.classesCount"
        [studentsCount]="subject.studentsCount"
        [addOpacity]="store.subjectsFetching()"
      ></app-subject-card>
    }
  </ng-container>
</app-paged-list>
