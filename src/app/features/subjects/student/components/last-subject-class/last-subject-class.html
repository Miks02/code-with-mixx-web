<div
  class="bg-linear-to-br from-emerald-950 to-emerald-900 rounded-lg shadow-lg p-4 h-full min-h-40 flex flex-col gap-4"
>
  @if (isPending()) {
    <div class="flex items-center justify-between gap-3">
      <app-skeleton width="45%" />
      <app-skeleton variant="circular" width="2.25rem" />
    </div>

    <div class="flex flex-col gap-2 mt-auto">
      <app-skeleton width="70%" height="1.5rem" />
      <app-skeleton width="40%" />
    </div>
  } @else {
    <div class="flex items-center justify-between gap-3">
      <h2 class="text-lg md:text-xl font-semibold text-emerald-100">Poslednji čas</h2>
      <div class="flex items-center justify-center bg-emerald-500/40 rounded-full p-2 shrink-0">
        <ng-icon
          name="faSolidClockRotateLeft"
          class="text-emerald-100! text-lg self-center!"
        ></ng-icon>
      </div>
    </div>

    @if (lastClass(); as lastClass) {
      <div class="flex flex-col gap-1 mt-auto">
        <p class="text-lg md:text-2xl font-bold text-emerald-100 truncate">
          {{ lastClass.subjectName }}
        </p>
        <div class="flex items-center gap-2 text-emerald-300 text-sm">
          <ng-icon
            name="faSolidCalendar"
            class="text-emerald-400! text-base self-center!"
          ></ng-icon>
          <span>{{ classDate() }}</span>
        </div>
      </div>
    } @else {
      <p class="mt-auto text-emerald-100/70">Još nema održanih časova.</p>
    }
  }
</div>
