<app-panel
  class="h-full md:min-h-80 relative backdrop-blur-xl"
  [title]="subject()?.subjectName ?? 'Detalji predmeta'"
>
  @if (subject(); as subject) {
    <div class="flex gap-2 flex-wrap">
      @for (stat of stats(); track stat.label) {
        <div
          class="flex items-center gap-2 rounded-lg px-2.5 py-1.5 flex-1 min-w-28 bg-emerald-900/80 text-emerald-100"
        >
          <ng-icon [name]="stat.icon" class="text-base self-center! text-emerald-400!"></ng-icon>
          <div class="flex flex-col min-w-0">
            <span class="text-sm font-semibold leading-tight truncate">{{ stat.value }}</span>
            <span class="text-xs text-emerald-300">{{ stat.label }}</span>
          </div>
        </div>
      }
    </div>

    <div class="border border-emerald-500 rounded-lg p-6 w-full mt-auto">
      <p class="text-emerald-300">{{ subject.subjectDescription }}</p>
    </div>
  } @else {
    <app-empty-state
      class="my-auto"
      icon="faSolidHandPointer"
      message="Izaberi predmet iz liste da vidiš detalje"
    ></app-empty-state>
  }
</app-panel>
