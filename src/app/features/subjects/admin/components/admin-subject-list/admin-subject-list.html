<app-paged-list
  title="Predmeti"
  emptyMessage="Nije pronadjen nijedan predmet."
  [page]="store.pagedSubjects()"
  [isPending]="store.subjectsPending()"
  (previousPage)="store.previousPage()"
  (nextPage)="store.nextPage()"
>
  <ng-container filters>
    <app-button
      variant="ghost"
      size="sm"
      icon="faSolidBoxArchive"
      class="hidden md:inline-flex"
      [class]="
        store.params.onlyArchived()
          ? 'hidden md:inline-flex bg-emerald-700 rounded-lg'
          : 'hidden md:inline-flex'
      "
      (click)="store.toggleOnlyArchived()"
    >
      Arhivirani
    </app-button>

    <button
      type="button"
      (click)="store.toggleOnlyArchived()"
      [class]="store.params.onlyArchived() ? 'border-amber-500' : 'border-emerald-400'"
      class="md:hidden shrink-0 rounded-full bg-emerald-700 p-2 flex justify-center items-center border-2 cursor-pointer shadow-lg active:scale-95 transition-200"
    >
      <ng-icon name="faSolidBoxArchive" class="text-emerald-300! self-center!"></ng-icon>
    </button>

    <app-sort-menu
      [options]="sort"
      [selected]="store.params.sortBy()"
      (sortChanged)="store.setSort($event)"
    ></app-sort-menu>

    <app-search-bar
      placeholder="Pretraži predmete"
      (searchTerm)="store.setSearchTerm($event)"
    ></app-search-bar>
  </ng-container>

  <ng-container>
    @for (subject of store.pagedSubjectsItems(); track subject.id) {
    <app-subject-card
      [subject]="subject"
      [addOpacity]="store.subjectsFetching()"
      [isSelected]="subject.id === store.selectedSubjectId()"
      (selected)="store.selectSubject($event)"
    ></app-subject-card>
    }
  </ng-container>
</app-paged-list>
