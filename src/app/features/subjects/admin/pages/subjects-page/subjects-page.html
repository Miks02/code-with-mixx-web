<div class="flex flex-col gap-6">
  <div class="flex flex-col lg:flex-row gap-6">
    <app-admin-subject-list class="flex-1 min-w-0"></app-admin-subject-list>

    @if (store.isEditing()) {
      <app-edit-subject-form class="flex-1 min-w-0"></app-edit-subject-form>
    } @else {
      <app-subject-details
        [appScrollIntoViewOn]="store.detailsScrollRequests()"
        class="flex-1 min-w-0"
      ></app-subject-details>
    }
  </div>

  <div class="flex flex-col lg:flex-row gap-6">
    <div class="grid grid-cols-1 grid-rows-4 sm:grid-cols-6 sm:grid-rows-2 flex-1 gap-4">
      <app-most-popular-subject
        class="flex-1 min-w-0 sm:col-span-4"
        [subject]="store.mostPopularSubject()"
        [isPending]="store.summaryPending()"
      ></app-most-popular-subject>
      <app-stats-card
        title="Predmeti"
        icon="faSolidBook"
        iconBackground="sky"
        description="Ukupno"
        [value]="store.summary()?.totalSubjects"
        [isPending]="store.summaryPending()"
        class="flex-1 min-w-0 sm:col-span-2"
      ></app-stats-card>

      <app-stats-card
        title="Neodržani predmeti"
        icon="faSolidBookSkull"
        iconBackground="red"
        description="Predmeti koji još nisu predavani"
        [value]="store.summary()?.untaughtSubjects"
        [isPending]="store.summaryPending()"
        class="flex-1 min-w-0 sm:col-span-3"
      ></app-stats-card>

      <app-stats-card
        title="Održani predmeti"
        icon="faSolidBookOpen"
        iconBackground="violet"
        description="Predmeti koji su predavani"
        [value]="store.summary()?.taughtSubjects"
        [isPending]="store.summaryPending()"
        class="flex-1 min-w-0 sm:col-span-3"
      ></app-stats-card>
    </div>

    <app-create-subject-form class="flex-2 min-w-0"></app-create-subject-form>
  </div>
</div>
