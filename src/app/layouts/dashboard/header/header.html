<header class="bg-emerald-950 w-full flex-1 px-6 py-4 flex justify-between items-center">
  <div
    class="hidden md:flex items-center w-70 px-3 bg-emerald-800 rounded-lg transition duration-200 focus-within:ring-2 focus-within:ring-emerald-500/20"
  >
    <label for="search" class="flex items-center">
      <ng-icon name="faSolidMagnifyingGlass" class="text-emerald-300! text-lg self-center!" />
    </label>

    <input
      id="search"
      type="text"
      placeholder="Pretraži studenta..."
      class="w-full px-2.5 py-2.5 bg-transparent text-sm text-white placeholder:text-emerald-300 outline-none"
    />
  </div>

  <h1 class="text-emerald-200 font-semibold text-2xl md:hidden">Naslov</h1>

  <div class="flex gap-4 items-center">
    <button
      class="rounded-full bg-emerald-700 p-2 md:hidden flex justify-center items-center border-2 border-emerald-400 cursor-pointer shadow-lg hover:border-amber-500 active:scale-95 transition-200"
    >
      <ng-icon name="faSolidMagnifyingGlass" class="text-emerald-300! self-center!"></ng-icon>
    </button>

    <div class="flex gap-2 items-center">
      <a
        class="rounded-full bg-emerald-700 p-2 md:w-10 md:h-10 flex justify-center items-center border-2 border-emerald-400 cursor-pointer shadow-lg hover:border-amber-500 active:scale-95 transition-200"
      >
        <ng-icon name="faSolidUser" class="text-emerald-300! md:text-xl self-center!"></ng-icon>
      </a>
      <p class="hidden md:block text-emerald-100 font-semibold text-lg">Milan Nikolić</p>
    </div>
    <button
      (click)="onOpenSidebar()"
      class="rounded-full bg-emerald-700 p-2 flex md:hidden justify-center items-center border-2 border-emerald-400 cursor-pointer shadow-lg hover:border-amber-500 active:scale-95 transition-200"
    >
      <ng-icon name="faSolidBars" class="text-emerald-300! self-center!"></ng-icon>
    </button>
  </div>
</header>
