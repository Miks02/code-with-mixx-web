<div class="relative isolate w-screen h-screen flex bg-emerald-900 overflow-hidden">
  <div #vantaRef class="absolute inset-0 -z-20" aria-hidden="true"></div>
  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-linear-to-b from-emerald-950/50 via-transparent to-emerald-950/30"
    aria-hidden="true"
  ></div>

  <app-sidebar
    (closeSidebar)="isSidebarOpen.set(false)"
    [showSidebar]="isSidebarOpen()"
  ></app-sidebar>
  <div class="relative flex flex-col w-full grow overflow-hidden min-h-0">
    <app-header (toggleSidebar)="isSidebarOpen.set(true)"></app-header>
    <div class="p-6 w-full grow overflow-y-auto min-h-0">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
