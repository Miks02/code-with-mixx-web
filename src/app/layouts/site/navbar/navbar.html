<header class="fixed top-0 left-0 z-50 w-full px-6 py-4 bg-emerald-950 shadow-lg">
  <nav class="flex items-center justify-between lg:grid lg:grid-cols-[1fr_auto_1fr] lg:mx-7">
    <a
      class="text-white text-2xl font-bold transition-200 hover:opacity-70 active:opacity-50 lg:justify-self-start"
      routerLink="/"
      ><span class="text-amber-500">Code</span>WithMixx</a
    >

    <button
      type="button"
      class="menu-toggle"
      aria-controls="nav-menu"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? 'Zatvori meni' : 'Otvori meni'"
      (click)="toggleMenu()"
    >
      <ng-icon [name]="isMenuOpen() ? 'faSolidXmark' : 'faSolidBars'"></ng-icon>
    </button>

    <div id="nav-menu" class="nav-menu" [class.open]="isMenuOpen()">
      <ul
        class="flex flex-col gap-1 text-lg text-emerald-100 font-semibold lg:flex-row lg:gap-4 lg:text-base xl:gap-6 xl:text-lg"
      >
        <li>
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
            >Početna</a
          >
        </li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">Usluge</a></li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">Predmeti</a></li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">Moja priča</a></li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">O projektu</a></li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">Cenovnik</a></li>
        <li><a class="nav-link" routerLink="/" (click)="closeMenu()">Kontakt</a></li>
      </ul>

      @if (!isAuthenticated()) {
      <app-button
        class="lg:justify-self-end"
        routerLink="/auth/login"
        variant="ghost"
        icon="faSolidArrowRightToBracket"
        [fullWidth]="true"
        (clicked)="closeMenu()"
        >Prijava</app-button
      >
      } @else {
      <div
        class="flex flex-col gap-1 border-t border-white/10 pt-3 lg:flex-row lg:gap-3 lg:justify-self-end lg:border-0 lg:pt-0"
      >
        <a
          class="flex items-center gap-3 rounded-lg px-4 py-3 text-lg font-semibold text-emerald-300 transition-200 hover:bg-white/5 hover:text-emerald-200 active:scale-95 active:bg-amber-500/20 lg:size-10 lg:justify-center lg:rounded-full lg:border-2 lg:border-emerald-400 lg:bg-emerald-700 lg:p-0 lg:shadow-lg lg:hover:border-amber-500 lg:hover:bg-emerald-700"
          routerLink="/admin/settings"
          aria-label="Moj profil"
          title="Moj profil"
          (click)="closeMenu()"
        >
          <ng-icon name="faSolidUser"></ng-icon>
          <span class="lg:hidden">Moj profil</span>
        </a>

        <button
          type="button"
          class="flex cursor-pointer items-center gap-3 rounded-lg px-4 py-3 text-lg font-semibold text-red-400 transition-200 hover:bg-white/5 hover:text-red-300 active:scale-95 active:bg-amber-500/20 lg:size-10 lg:justify-center lg:rounded-full lg:border-2 lg:border-emerald-400 lg:bg-emerald-700 lg:p-0 lg:shadow-lg lg:hover:border-red-400 lg:hover:bg-emerald-700"
          aria-label="Odjavi se"
          title="Odjavi se"
          (click)="onLogout()"
        >
          <ng-icon name="faSolidRightFromBracket"></ng-icon>
          <span class="lg:hidden">Odjavi se</span>
        </button>
      </div>
      }
    </div>
  </nav>
</header>
