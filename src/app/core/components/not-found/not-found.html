<section
  class="relative isolate flex w-full flex-1 justify-center overflow-hidden bg-emerald-950 sm:items-center sm:px-6 sm:pt-28 sm:pb-16 lg:pt-32"
>
  <div #fog class="absolute inset-0 -z-20" aria-hidden="true"></div>

  <div
    class="pointer-events-none absolute inset-0 -z-10 bg-linear-to-b from-emerald-950 via-emerald-950/20 to-emerald-950/80"
    aria-hidden="true"
  ></div>

  <div
    class="flex w-full flex-col items-center justify-center gap-6 bg-emerald-950/80 px-6 pt-28 pb-12 text-center backdrop-blur-md sm:max-w-lg sm:rounded-2xl sm:px-12 sm:py-12 sm:shadow-2xl 3xl:max-w-2xl 3xl:gap-8 3xl:py-16"
  >
    <span class="text-8xl leading-none font-bold text-emerald-300 sm:text-9xl" aria-hidden="true"
      >404</span
    >
    <h1 class="text-4xl font-bold text-white sm:text-5xl 3xl:text-6xl">Stranica nije pronađena</h1>
    <p class="text-lg text-emerald-50/90 sm:text-xl 3xl:text-2xl">
      Izvinjavam se, ova stranica je maločas pala ispit.
    </p>
    <p class="text-base text-emerald-100/70">Ova adresa ne postoji ili je premeštena.</p>
    <app-button variant="secondary" size="lg" icon="faSolidArrowLeft" (clicked)="goBack()">
      {{ backButtonTitle }}
    </app-button>
  </div>
</section>
