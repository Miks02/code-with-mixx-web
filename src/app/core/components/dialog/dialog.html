<div
  (click)="onClose()"
  animate.enter="backdrop-in"
  class="w-screen h-screen absolute bg-emerald-900/60 backdrop-blur-xs z-1000 top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2 transition duration-300"
>
  <div
    animate.enter="dialog-in"
    class="relative top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2 w-[90%] md:w-[50%] lg:w-[30%] xl:w-[20%]"
  >
    <div class="mx-auto flex flex-col gap-4 justify-center bg-emerald-200 rounded-lg shadow-lg p-4">
      <div class="flex w-full justify-between">
        <p class="text-xl font-semibold text-emerald-900">{{ options().title }}</p>

        <button
          (click)="onClose()"
          class="text-2xl text-red-900 cursor-pointer hover:opacity-70 active:opacity-50 transition-200"
        >
          <ng-icon name="faSolidXmark"></ng-icon>
        </button>
      </div>

      <p class="text-emerald-950 font-medium">{{ options().message }}</p>

      <div class="self-end flex gap-2">
        <app-button size="sm" variant="secondary" (clicked)="onClose()">Odustani</app-button>
        <app-button size="sm" (clicked)="onConfirm()">Potvrdi</app-button>
      </div>
    </div>
  </div>
</div>
