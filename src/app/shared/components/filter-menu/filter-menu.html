<div class="relative hidden xl:block flex-1 min-w-40 max-w-64">
  <button
    type="button"
    (click)="toggle()"
    [class]="classes().trigger"
    class="w-full flex items-center gap-2 rounded-lg px-3 py-2 cursor-pointer"
  >
    <ng-icon name="{{ icon() }}" [class]="classes().icon" class="text-sm self-center!"></ng-icon>
    <span [class]="classes().triggerText" class="flex-1 min-w-0 truncate text-left text-sm"
      >{{ selectedLabel() }}</span
    >
    <ng-icon
      name="faSolidChevronDown"
      [class]="classes().icon"
      class="text-xs! transition-transform duration-200"
      [class.rotate-180]="isOpen()"
    ></ng-icon>
  </button>

  @if (isOpen()) {
  <ul
    [class]="classes().menu"
    class="absolute left-0 right-0 top-full mt-2 z-10 rounded-lg shadow-lg py-1 overflow-hidden"
  >
    @for (entry of entries(); track entry[0]) {
    <li>
      <button
        type="button"
        [disabled]="isDisabled(entry[0])"
        (click)="toggleOption(entry[0])"
        [class]="optionClasses(entry[0])"
        class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm transition-200"
      >
        <span class="flex-1 min-w-0 truncate">{{ entry[1] }}</span>
        @if (isSelected(entry[0])) {
        <ng-icon name="faSolidCheck" [class]="classes().icon" class="text-xs! self-center!"></ng-icon>
        } @else if (isDisabled(entry[0])) {
        <ng-icon name="faSolidXmark" class="text-rose-400/60! text-xs! self-center!"></ng-icon>
        }
      </button>
    </li>
    }
  </ul>
  }
</div>

<div class="relative xl:hidden">
  <button
    type="button"
    (click)="toggle()"
    [class]="mobileTriggerClasses()"
    class="shrink-0 rounded-full p-2 flex justify-center items-center border-2 cursor-pointer shadow-lg active:scale-95 transition-200"
  >
    <ng-icon name="faSolidFilter" [class]="classes().mobileIcon" class="self-center!"></ng-icon>
  </button>

  @if (isOpen()) {
  <ul
    [class]="classes().menu"
    class="absolute right-0 top-full mt-2 z-10 min-w-40 rounded-lg shadow-lg py-1 overflow-hidden"
  >
    @for (entry of entries(); track entry[0]) {
    <li>
      <button
        type="button"
        [disabled]="isDisabled(entry[0])"
        (click)="toggleOption(entry[0])"
        [class]="optionClasses(entry[0])"
        class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm whitespace-nowrap transition-200"
      >
        <span class="flex-1">{{ entry[1] }}</span>
        @if (isSelected(entry[0])) {
        <ng-icon name="faSolidCheck" [class]="classes().icon" class="text-xs! self-center!"></ng-icon>
        } @else if (isDisabled(entry[0])) {
        <ng-icon name="faSolidXmark" class="text-rose-400/60! text-xs! self-center!"></ng-icon>
        }
      </button>
    </li>
    }
  </ul>
  }
</div>
