<div class="flex items-center justify-between gap-3">
  <div class="flex items-center gap-2 min-w-0">
    <h2 class="text-xl font-semibold text-emerald-100 truncate">{{ title() }}</h2>
    @if (count() !== undefined) {
      <span
        class="shrink-0 rounded-full bg-emerald-800 px-2 py-0.5 text-xs font-semibold text-emerald-100"
        >{{ count() }}</span
      >
    }
  </div>

  <ng-content select="[panelAction]" />
</div>

<ng-content />
