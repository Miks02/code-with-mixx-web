<div
  class="flex justify-center items-center bg-emerald-900 rounded-full h-12 w-12 md:h-14 md:w-14 mb-2"
>
  <ng-icon [name]="icon()" class="text-emerald-400! text-xl md:text-2xl self-center!"></ng-icon>
</div>

<div class="flex flex-col items-center gap-1">
  @if (message()) {
  <p class="text-emerald-200 font-medium text-lg">{{ message() }}</p>
  } @if (description()) {
  <p class="text-emerald-200/70 text-sm md:text-base">{{ description() }}</p>
  }
</div>
