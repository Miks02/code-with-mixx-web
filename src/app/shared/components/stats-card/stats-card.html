<app-panel class="backdrop-blur-lg" [title]="title()">
  @if (isPending()) {
    <app-skeleton panelAction variant="circular" width="2.25rem" />
  } @else {
    <div
      panelAction
      [class.bg-sky-600/40]="iconBackground() === 'sky'"
      [class.bg-violet-600/40]="iconBackground() === 'violet'"
      [class.bg-red-600/40]="iconBackground() === 'red'"
      [class.bg-emerald-600/40]="iconBackground() === 'emerald'"
      [class.bg-amber-600/40]="iconBackground() === 'amber'"
      [class.bg-orange-600/40]="iconBackground() === 'orange'"
      class="p-2 shrink-0 rounded-full flex items-center"
    >
      <ng-icon name="{{ icon() }}" class="text-emerald-100! text-xl"></ng-icon>
    </div>
  }

  @if (isPending()) {
    <div class="flex justify-between items-center mt-auto">
      <app-skeleton width="30%" height="2.5rem" />
      <app-skeleton width="25%" />
    </div>
  } @else {
    <div class="flex justify-between items-center mt-auto">
      <p class="text-emerald-100 text-3xl md:text-5xl font-bold">{{ value() }}</p>
      <p class="text-emerald-100/80 text-sm md:text-base font-semibold self-end">
        {{ description() }}
      </p>
    </div>
  }
</app-panel>
