@if (count() > 1) {
<div class="flex flex-col gap-2" role="status" aria-hidden="true">
  @for (line of lines(); track $index) {
  <div
    [class]="baseClasses + ' ' + variantClasses()"
    [style.width]="width()"
    [style.height]="resolvedHeight()"
  ></div>
  }
</div>
} @else {
<div
  [class]="baseClasses + ' ' + variantClasses()"
  [style.width]="width()"
  [style.height]="resolvedHeight()"
  role="status"
  aria-hidden="true"
></div>
}
